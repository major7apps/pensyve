[package]
name = "pensyve-mcp-tools"
version = "2.2.0"
edition = "2024"
description = "Shared MCP tool definitions for Pensyve servers"
rust-version = "1.88"
license = "Apache-2.0"
homepage = "https://pensyve.com"
repository = "https://github.com/major7apps/pensyve"
documentation = "https://pensyve.com/docs"

[lib]
name = "pensyve_mcp_tools"

[dependencies]
pensyve-core = { path = "../pensyve-core", version = "2.2.0" }
rmcp = { version = "1.5", features = ["server", "macros"] }
tokio = { version = "1", features = ["full"] }
# G1/P3a: needed for `CancellationToken::new()` passed to
# `ConsolidationEngine::run` from the post-`episode_end` background spawn.
tokio-util = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[lints]
workspace = true
