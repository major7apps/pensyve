[package]
name = "pensyve-mcp"
version = "3.0.0"
edition = "2024"
description = "Pensyve MCP server (stdio transport) — universal memory runtime for AI agents"
rust-version = "1.88"
license = "Apache-2.0"
homepage = "https://pensyve.com"
repository = "https://github.com/major7apps/pensyve"
documentation = "https://pensyve.com/docs"

[[bin]]
name = "pensyve-mcp"
path = "src/main.rs"

[dependencies]
pensyve-core = { path = "../pensyve-core", version = "3.0.0" }
pensyve-mcp-tools = { path = "../pensyve-mcp-tools", version = "3.0.0" }
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
