name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/windows-release-runtime.ps1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build Python wheels (maturin + PyO3) ───────────────────────────────────
  # Only native builds — ONNX Runtime lacks prebuilt binaries for cross-compile
  build-python:
    name: Build Python ${{ matrix.python }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # Linux builds run inside a manylinux container with its own interpreters.
          args: --locked --release --out dist --manifest-path pensyve-python/Cargo.toml --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
          manylinux: "2_28"
          before-script-linux: dnf install -y openssl-devel perl-IPC-Cmd
      - name: Bundle the Windows native runtime in the wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = & ./scripts/windows-release-runtime.ps1
          python -m pip install delvewheel
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m delvewheel repair --include DirectML.dll --add-path "$($runtime.DirectML);$($runtime.CRT)" -w repaired $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item repaired/*.whl dist/ -Force
      - name: Install and import the built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -I -c "from pensyve._core import Pensyve"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  build-python-sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path pensyve-python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          if-no-files-found: error
          path: dist/*.tar.gz

  # ── Publish to PyPI (skipped if PYPI_TOKEN not configured) ──────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: release-built
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  # ── Stage on npm for approval (skipped if NPM_TOKEN not configured) ───────────────────
  build-npm:
    name: Build npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - working-directory: pensyve-ts
        run: |
          bun install --frozen-lockfile
          bun run build
          npm pack
          cd "$(mktemp -d)"
          npm install --offline --ignore-scripts "$GITHUB_WORKSPACE"/pensyve-ts/*.tgz
          node -e "import('@pensyve/sdk')"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: pensyve-ts/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Stage on npm
    needs: release-built
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: pensyve-ts/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with staged publishing support
        run: npm install -g npm@12.2.3
      - name: Check npm publish access
        if: env.HAS_NPM_TOKEN != ''
        working-directory: pensyve-ts
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm; skipping publish."
            echo "NPM_SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! NPM_USER="$(npm whoami 2>/tmp/npm-whoami.err)"; then
            echo "::error::NPM_TOKEN is set but npm authentication failed. Replace it with an automation or granular token that can publish ${PACKAGE_NAME}."
            cat /tmp/npm-whoami.err >&2
            exit 1
          fi

          if ! OWNERS="$(npm owner ls "${PACKAGE_NAME}" 2>/tmp/npm-owner.err)"; then
            echo "::error::Unable to read owners for ${PACKAGE_NAME}. The NPM_TOKEN user may not have package access."
            cat /tmp/npm-owner.err >&2
            exit 1
          fi

          if ! printf '%s\n' "$OWNERS" | awk '{print $1}' | grep -Fx "$NPM_USER" >/dev/null; then
            echo "::error::NPM_TOKEN authenticates as ${NPM_USER}, but that user is not an owner of ${PACKAGE_NAME}."
            echo "Owners returned by npm:"
            printf '%s\n' "$OWNERS"
            exit 1
          fi

          echo "NPM_SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
      # npm no longer lets a token publish directly: tokens that bypass 2FA can
      # only stage a version. This stages it with provenance; an owner then
      # approves it (`npm stage approve <id>` or on npmjs.com) to make it live.
      - name: Stage on npm for approval
        if: env.HAS_NPM_TOKEN != '' && env.NPM_SHOULD_PUBLISH == 'true'
        working-directory: pensyve-ts
        run: |
          npm stage publish ./*.tgz --access public --provenance
          echo "::notice::@pensyve/sdk is staged on npm, not live. Approve it with 'npm stage approve <id>' or on npmjs.com."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Publish to crates.io (skipped if CARGO_REGISTRY_TOKEN not configured) ──
  build-crate:
    name: Build crates.io package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked -p pensyve-core

  build-go:
    name: Build Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: pensyve-go/go.mod
      - working-directory: pensyve-go
        run: go test ./...

  publish-crates:
    name: Publish to crates.io
    needs: release-built
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish pensyve-core
        if: env.HAS_CARGO_TOKEN != ''
        run: cargo publish --locked -p pensyve-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Build CLI binaries (native targets only) ───────────────────────────────
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pensyve-cli-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pensyve-cli-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pensyve-cli-windows-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Windows packaging also needs the DLL from the exact ort-sys build.
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'
        continue-on-error: true
        with:
          key: cli-${{ matrix.target }}
      - name: Build CLI
        run: cargo build --locked --release -p pensyve-cli
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/release/pensyve staging/pensyve
          staging/pensyve --version
          cd staging && tar czf ../${{ matrix.artifact }}.tar.gz pensyve
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging
          cp target/release/pensyve.exe staging/pensyve.exe
          $runtime = & ./scripts/windows-release-runtime.ps1
          Copy-Item "$($runtime.DirectML)/DirectML.dll" staging/
          Copy-Item "$($runtime.CRT)/*.dll" staging/
          & ./staging/pensyve.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact }}.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.artifact }}.*

  # ── Build MCP server binary (native targets only) ──────────────────────────
  build-mcp:
    name: Build MCP (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pensyve-mcp-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pensyve-mcp-macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: mcp-${{ matrix.target }}
      - name: Build MCP server
        run: cargo build --locked --release -p pensyve-mcp
      - name: Package
        run: |
          mkdir -p staging
          cp target/release/pensyve-mcp staging/pensyve-mcp
          cd staging && tar czf ../${{ matrix.artifact }}.tar.gz pensyve-mcp
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.artifact }}.*

  # ── Publish MCP server image to ghcr (MCP registry + Smithery) ────────────
  # server.json's OCI package points at this image, so the registry publish
  # (publish-mcp-registry.yml) runs only after this workflow succeeds.
  build-mcp-image:
    name: Build MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the offline MCP image
        run: |
          docker build -f pensyve-mcp/Dockerfile --build-arg SOURCE_SHA="$GITHUB_SHA" -t pensyve-mcp:release .
          docker run --rm -i --network none pensyve-mcp:release > response.json <<'EOF'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          EOF
          jq -e '.result.serverInfo.name == "pensyve-mcp"' response.json
      - name: Save the verified image
        run: docker save pensyve-mcp:release | zstd -T0 -o image.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: release-oci-image
          path: image.tar.zst
          compression-level: 0
          if-no-files-found: error

  publish-mcp-image:
    name: Publish MCP image
    needs: release-built
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-oci-image
      - name: Load and push the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zstd -dc image.tar.zst | docker load
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE=ghcr.io/major7apps/pensyve-mcp
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag pensyve-mcp:release "${IMAGE}:${VERSION}"
          docker tag pensyve-mcp:release "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

  # ── Package Codex plugin ──────────────────────────────────────────────────
  package-codex-plugin:
    name: Package Codex plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate plugin metadata
        run: |
          python -m json.tool integrations/codex-plugin/.codex-plugin/plugin.json >/dev/null
          python -m json.tool integrations/codex-plugin/.mcp.json >/dev/null
          python -m json.tool integrations/codex-plugin/.agents/plugins/marketplace.json >/dev/null
          bash integrations/codex-plugin/scripts/lint-mcp-refs.sh
      - name: Package plugin
        run: |
          PLUGIN_VERSION="$(python -c "import json; print(json.load(open('integrations/codex-plugin/.codex-plugin/plugin.json'))['version'])")"
          tar -czf "pensyve-codex-plugin-v${PLUGIN_VERSION}.tar.gz" -C integrations codex-plugin
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pensyve-codex-plugin
          if-no-files-found: error
          path: pensyve-codex-plugin-v*.tar.gz

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release-built:
    name: All release artifacts built
    needs: [build-cli, build-mcp, build-python, build-python-sdist, build-crate, build-go, build-npm, build-mcp-image, package-codex-plugin]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All release builds passed.'

  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-crates, publish-npm, publish-mcp-image]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '{wheels-*,pensyve-cli-*,pensyve-mcp-*,pensyve-codex-plugin}'
          path: artifacts/
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" | while read f; do
            cp "$f" release-assets/
          done
      - name: Tag Go module
        run: |
          tag="pensyve-go/${GITHUB_REF_NAME}"
          # Push directly from the checked-out commit. A matching existing tag is
          # idempotent; a tag at a different commit fails without being overwritten.
          git push origin "HEAD:refs/tags/$tag"
      - name: Bind release display title
        run: echo "RELEASE_DISPLAY_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_DISPLAY_NAME }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
      - name: Publish the completed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
