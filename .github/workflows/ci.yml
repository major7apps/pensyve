name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python lint
        run: |
          uv sync --extra dev
          uv run ruff check pensyve_server/ integrations/ tests/
          uv run pyright pensyve_server/
      - uses: oven-sh/setup-bun@v2
      - name: TypeScript lint
        working-directory: pensyve-ts
        run: |
          bun install
          bun run lint

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace

  test-rust-postgres:
    name: Rust Tests (postgres)
    runs-on: ubuntu-latest
    # `pensyve-core`'s `postgres` feature is non-default. "Rust Tests" above
    # compiles it (pensyve-mcp-gateway turns it on), but nothing has ever run
    # it against a real server, so every Postgres-only behaviour — RLS
    # policies, the namespace GUC, the handwritten SQL in
    # `storage/postgres.rs` — was untested. That gap is what let the #218
    # scoped-delete bug through: SQLite has no row-level security, so no
    # existing test could observe it. Tracked by #225.
    #
    # Not a required check yet: promotion happens in repo settings once this
    # job has a few green runs behind it.
    services:
      postgres:
        # pgvector, not plain `postgres:16` — `postgres_schema.sql` opens with
        # `CREATE EXTENSION IF NOT EXISTS vector` and the stock image has no
        # such extension available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Deliberately not `DATABASE_URL`: the live tests create and drop their
      # own databases and roles, so they demand a test-only variable rather
      # than the one a real deployment reads. Tests skip themselves with an
      # explicit message when it is unset.
      #
      # This points at the *admin* role. Each test provisions a throwaway
      # database plus an unprivileged owner role from it and applies
      # `postgres_schema.sql` there (via `PostgresBackend::from_pool`), so the
      # schema needs no separate CI step and the `postgres` database stays
      # empty.
      PENSYVE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pensyve-core tests with the postgres feature
        run: cargo test -p pensyve-core --features postgres

  test-rust-models:
    name: Rust Tests (with models)
    runs-on: ubuntu-latest
    # Model downloads from HuggingFace are externally flaky and don't gate
    # the merge — the deterministic Rust suite ("Rust Tests") above already
    # blocks regressions in our code. This job stays as informational signal
    # for the model-loading integration path; transient HF outages or rate
    # limits surface as a non-blocking failure here.
    continue-on-error: true
    env:
      # Pin fastembed's cache to a stable path under the workspace so
      # `actions/cache` can hit the same directory fastembed actually reads.
      # Default is `<cwd>/.fastembed_cache` per `fastembed::common::get_cache_dir`
      # (see pensyve-core/src/embedding.rs:42-48); overriding gives us a
      # canonical absolute path independent of cwd.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache fastembed ONNX models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # Key only changes when the supported-models list changes (bump
          # the version suffix to force a fresh download).
          key: fastembed-models-${{ runner.os }}-v1
      - name: Pre-warm model cache (sequential)
        # Run a single test from the model suite first to populate the
        # cache sequentially. Without this, the parallel `cargo test`
        # invocation below has multiple test threads racing to download
        # the same model.onnx into the shared `.fastembed_cache`, which
        # produces "Failed to retrieve model.onnx" failures on the loser.
        # Running one test first guarantees the cache is fully populated
        # before any concurrent loaders.
        continue-on-error: true
        run: cargo test -p pensyve-core --release embedding::tests::test_real_embedding_dimensions -- --ignored --test-threads=1
      - name: Run model-dependent tests
        # `--test-threads=1` enforces serial execution. Even with the
        # cache pre-warmed above, `OnnxEmbedder::new` writes session
        # state into the cache the first time a model variant is touched
        # in a process; serializing avoids any residual races on the
        # WAL/index files fastembed maintains alongside `model.onnx`.
        run: cargo test --workspace -- --ignored --test-threads=1
  paraphrase-recall-gate:
    name: Paraphrase Recall Gate
    runs-on: ubuntu-latest
    # Unlike `test-rust-models` above, this job is NOT continue-on-error:
    # it exists to BLOCK merges that regress paraphrase recall (#186).
    # It carries little of `test-rust-models`'s HuggingFace-flakiness
    # risk because the model cache is shared with that job's key and is
    # warm on any run after the first; on a cold cache the seed step
    # below downloads serially in a single process, the same controlled
    # pattern `test-rust-no-network-invariants` uses for its blocking
    # job.
    env:
      # Same rationale as `test-rust-models`: pin fastembed's cache to a
      # workspace-absolute path so `actions/cache` and the eval binary
      # resolve the same directory.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache fastembed ONNX models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # Shares `test-rust-models`'s key so both jobs reuse one
          # accumulated cache (GTE embedder + BGE reranker included).
          key: fastembed-models-${{ runner.os }}-v1
      - name: Seed model cache on miss (single process, serial downloads)
        if: steps.model-cache.outputs.cache-hit != 'true'
        # One ungated eval run downloads exactly the two models the gate
        # needs (gte-base-en-v1.5 + bge-reranker-base) inside a single
        # process, so there are no concurrent-download races. The gate
        # run below then executes against a warm cache.
        run: cargo run -p pensyve-benchmarks --bin paraphrase_eval --release -- --rerank
      - name: Paraphrase recall gate
        # Fails if top3_hit_rate drops more than --gate-margin below the
        # committed pensyve-benchmarks/results/paraphrase_baseline.json
        # (#186). Task 8 rebaselined this gate on the RERANKED pipeline
        # (`--rerank`) rather than the raw RRF pipeline the gate used
        # through Task 7: the gateway/CLI attach the BGE reranker by
        # default (`reranker=Some("BGERerankerBase")` in
        # pensyve-python/src/lib.rs), so gating on unreranked output was
        # comparing against a path production doesn't actually take. It
        # also happens to be far less noisy — the unreranked pipeline's
        # apply_reinforcement writes wall-clock last_accessed during
        # eval, so score ties occasionally resolve differently between
        # runs even with deterministic tiebreaks (Task 3.5), which is
        # why the original unreranked gate needed a 0.07 margin (15
        # local runs against the pre-fix 0.581 baseline spread
        # top3_hit_rate over {0.548, 0.565, 0.581, 0.597}, a 0.049
        # range). The reranked pipeline doesn't have that failure mode:
        # 10 local `--release --rerank` runs against the new baseline
        # (0.903) all landed on exactly 0.903 — zero observed spread.
        # Mechanistically: this fixture's gold docs already sit within
        # the top-20 pre-rerank pool, so the last_accessed jitter that
        # reshuffles ties at the pool boundary never changes which
        # candidates the cross-encoder sees, only their pre-rerank
        # order, which reranking discards anyway. 0.03 keeps meaningful
        # headroom over that for CI-hardware variance and reranker-load
        # fallback risk (a model-load failure degrades gracefully to
        # unreranked per `resolve_reranker`, which would read as a real
        # drop here) while being more than 2x tighter than the old
        # margin. paraphrase_eval also hard-errors if the committed
        # baseline's recorded mode (reranked/unreranked) doesn't match
        # --rerank below, so a future baseline write in the wrong mode
        # can't silently widen this margin (see BaselineOutput::reranked
        # in paraphrase_eval.rs).
        run: cargo run -p pensyve-benchmarks --bin paraphrase_eval --release -- --rerank --gate pensyve-benchmarks/results/paraphrase_baseline.json --gate-margin 0.03

  test-rust-no-network-invariants:
    name: Rust No-Network Invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Unlike `test-rust-models` above, this job is NOT continue-on-error:
    # these tests are the regression gate for the cached-model-resolution
    # incident tracked in issue #191 (fastembed 5.17.2 -> 5.17.3 was
    # suspected, then cleared, of breaking offline cache reads — see the
    # comment on the `fastembed` dependency in `pensyve-core/Cargo.toml`).
    # Once the cache below is seeded they make zero network calls, so they
    # carry none of `test-rust-models`'s HuggingFace-flakiness risk and are
    # safe to block merges on.
    env:
      # Same rationale as `test-rust-models`: pin fastembed's cache to a
      # workspace-absolute path so `actions/cache` and pensyve-core's
      # per-package test cwd both resolve the same directory.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
      # Keep the online pre-build and isolated execution on the same
      # workspace-owned target directory across the sudo boundary.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve fastembed version
        id: fastembed-version
        run: |
          version=$(awk '/^name = "fastembed"$/{found=1} found && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache fastembed ONNX models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # Keyed on the resolved fastembed version plus the fixed set of
          # model ids `test_no_network_invariants` requires. A fastembed
          # bump that changes the on-disk cache layout invalidates this
          # key, forcing a fresh, verified download instead of silently
          # reusing a stale/incompatible cache — the same failure mode the
          # original incident report worried about.
          key: fastembed-models-${{ runner.os }}-fastembed${{ steps.fastembed-version.outputs.version }}-minilm-l6-v2+bge-reranker-base-v1
      - name: Seed model cache on miss (sequential, controlled download)
        if: steps.model-cache.outputs.cache-hit != 'true'
        # Downloads exactly the two models the invariant tests below
        # need to find cached, one at a time. Serial on purpose: concurrent
        # first-use downloads into a shared cache dir race on the same blob
        # files (see the identical rationale in `test-rust-models` above).
        run: |
          cargo test -p pensyve-core --release embedding::tests::test_real_embedding_dimensions -- --ignored --test-threads=1
          cargo test -p pensyve-core --release reranker::tests::test_reranker_real_bge -- --ignored --test-threads=1
      - name: Pre-build no-network invariant tests with network available
        # Populate Cargo's target directory before entering the isolated
        # namespace so the test phase only executes already-built artifacts.
        run: cargo test -p pensyve-core --test test_no_network_invariants --no-run
      - name: Run no-network invariant tests with egress denied
        # GitHub-hosted Ubuntu runners provide passwordless sudo. A root-created
        # network namespace leaves the test process with no external interfaces;
        # the proxy variables are a second fail-fast guard for proxy-aware clients.
        env:
          # actionlint rejects case-duplicate keys, so only the uppercase pair is
          # declared here; the lowercase aliases most curl-family clients read are
          # set on the inner `env` invocation below.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          sudo unshare --net -- sudo -u "$USER" -E env \
            HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            FASTEMBED_CACHE_DIR="$FASTEMBED_CACHE_DIR" \
            PATH="$PATH" \
            HTTP_PROXY="$HTTP_PROXY" \
            HTTPS_PROXY="$HTTPS_PROXY" \
            http_proxy="$HTTP_PROXY" \
            https_proxy="$HTTPS_PROXY" \
            cargo test -p pensyve-core --test test_no_network_invariants

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          uv sync --extra dev
          uv run maturin develop --manifest-path pensyve-python/Cargo.toml
          uv run pytest tests/python/ -v

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install and test
        working-directory: pensyve-ts
        run: |
          bun install
          bun run build
          bun test

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: pensyve-go/go.mod
      - name: Run tests
        working-directory: pensyve-go
        run: go test ./... -v

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run tests
        working-directory: pensyve-wasm
        run: wasm-pack test --node

  test-gateway:
    name: Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gateway
        run: cargo build -p pensyve-mcp-gateway
      - name: Run gateway tests
        run: cargo test -p pensyve-mcp-gateway -p pensyve-mcp-tools

  test-gateway-artifact-source:
    name: Gateway Artifact Source Contracts
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify shell syntax and immutable artifact flow fixtures
        run: |
          python3 - <<'PY'
          import platform
          assert platform.python_version().startswith("3.12.")
          assert platform.python_implementation() == "CPython"
          assert platform.machine() in {"x86_64", "aarch64", "arm64"}
          PY
          python3 -m venv "$RUNNER_TEMP/gateway-workflow-validator"
          printf '%s\n' \
            'PyYAML==6.0.2 --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476' \
            > "$RUNNER_TEMP/gateway-workflow-validator.requirements.txt"
          "$RUNNER_TEMP/gateway-workflow-validator/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/gateway-workflow-validator.requirements.txt"
          export PATH="$RUNNER_TEMP/gateway-workflow-validator/bin:$PATH"
          bash -n pensyve-mcp-gateway/scripts/fetch-model-bundle.sh
          bash -n pensyve-mcp-gateway/scripts/test-model-bundle.sh
          bash -n pensyve-mcp-gateway/scripts/gateway-image-artifact.sh
          bash -n pensyve-mcp-gateway/scripts/test-gateway-release-image.sh
          bash -n pensyve-mcp-gateway/scripts/promote-gateway-image.sh
          bash -n pensyve-mcp-gateway/scripts/test-gateway-artifact-flow.sh
          pensyve-mcp-gateway/scripts/test-gateway-artifact-flow.sh all
