name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python lint
        run: |
          uv sync --extra dev
          uv run ruff check pensyve_server/ integrations/ tests/
          uv run pyright pensyve_server/
      - uses: oven-sh/setup-bun@v2
      - name: TypeScript lint
        working-directory: pensyve-ts
        run: |
          bun install
          bun run lint

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace

  test-rust-models:
    name: Rust Tests (with models)
    runs-on: ubuntu-latest
    # Model downloads from HuggingFace are externally flaky and don't gate
    # the merge — the deterministic Rust suite ("Rust Tests") above already
    # blocks regressions in our code. This job stays as informational signal
    # for the model-loading integration path; transient HF outages or rate
    # limits surface as a non-blocking failure here.
    continue-on-error: true
    env:
      # Pin fastembed's cache to a stable path under the workspace so
      # `actions/cache` can hit the same directory fastembed actually reads.
      # Default is `<cwd>/.fastembed_cache` per `fastembed::common::get_cache_dir`
      # (see pensyve-core/src/embedding.rs:42-48); overriding gives us a
      # canonical absolute path independent of cwd.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache fastembed ONNX models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # Key only changes when the supported-models list changes (bump
          # the version suffix to force a fresh download).
          key: fastembed-models-${{ runner.os }}-v1
      - name: Pre-warm model cache (sequential)
        # Run a single test from the model suite first to populate the
        # cache sequentially. Without this, the parallel `cargo test`
        # invocation below has multiple test threads racing to download
        # the same model.onnx into the shared `.fastembed_cache`, which
        # produces "Failed to retrieve model.onnx" failures on the loser.
        # Running one test first guarantees the cache is fully populated
        # before any concurrent loaders.
        continue-on-error: true
        run: cargo test -p pensyve-core --release embedding::tests::test_real_embedding_dimensions -- --ignored --test-threads=1
      - name: Run model-dependent tests
        # `--test-threads=1` enforces serial execution. Even with the
        # cache pre-warmed above, `OnnxEmbedder::new` writes session
        # state into the cache the first time a model variant is touched
        # in a process; serializing avoids any residual races on the
        # WAL/index files fastembed maintains alongside `model.onnx`.
        run: cargo test --workspace -- --ignored --test-threads=1
      - name: Paraphrase recall gate
        # Fails if top3_hit_rate drops more than --gate-margin below the
        # committed pensyve-benchmarks/results/paraphrase_baseline.json
        # (#186). Task 8 rebaselined this gate on the RERANKED pipeline
        # (`--rerank`) rather than the raw RRF pipeline the gate used
        # through Task 7: the gateway/CLI attach the BGE reranker by
        # default (`reranker=Some("BGERerankerBase")` in
        # pensyve-python/src/lib.rs), so gating on unreranked output was
        # comparing against a path production doesn't actually take. It
        # also happens to be far less noisy — the unreranked pipeline's
        # apply_reinforcement writes wall-clock last_accessed during
        # eval, so score ties occasionally resolve differently between
        # runs even with deterministic tiebreaks (Task 3.5), which is
        # why the original unreranked gate needed a 0.07 margin (15
        # local runs against the pre-fix 0.581 baseline spread
        # top3_hit_rate over {0.548, 0.565, 0.581, 0.597}, a 0.049
        # range). The reranked pipeline doesn't have that failure mode:
        # 10 local `--release --rerank` runs against the new baseline
        # (0.903) all landed on exactly 0.903 — zero observed spread.
        # 0.03 keeps meaningful headroom over that for CI-hardware
        # variance and reranker-load fallback risk (a model-load
        # failure degrades gracefully to unreranked per
        # `resolve_reranker`, which would read as a real drop here) while
        # being more than 2x tighter than the old margin.
        run: cargo run -p pensyve-benchmarks --bin paraphrase_eval --release -- --rerank --gate pensyve-benchmarks/results/paraphrase_baseline.json --gate-margin 0.03

  test-rust-no-network-invariants:
    name: Rust No-Network Invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Unlike `test-rust-models` above, this job is NOT continue-on-error:
    # these tests are the regression gate for the cached-model-resolution
    # incident tracked in issue #191 (fastembed 5.17.2 -> 5.17.3 was
    # suspected, then cleared, of breaking offline cache reads — see the
    # comment on the `fastembed` dependency in `pensyve-core/Cargo.toml`).
    # Once the cache below is seeded they make zero network calls, so they
    # carry none of `test-rust-models`'s HuggingFace-flakiness risk and are
    # safe to block merges on.
    env:
      # Same rationale as `test-rust-models`: pin fastembed's cache to a
      # workspace-absolute path so `actions/cache` and pensyve-core's
      # per-package test cwd both resolve the same directory.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
      # Keep the online pre-build and isolated execution on the same
      # workspace-owned target directory across the sudo boundary.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve fastembed version
        id: fastembed-version
        run: |
          version=$(awk '/^name = "fastembed"$/{found=1} found && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache fastembed ONNX models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # Keyed on the resolved fastembed version plus the fixed set of
          # model ids `test_no_network_invariants` requires. A fastembed
          # bump that changes the on-disk cache layout invalidates this
          # key, forcing a fresh, verified download instead of silently
          # reusing a stale/incompatible cache — the same failure mode the
          # original incident report worried about.
          key: fastembed-models-${{ runner.os }}-fastembed${{ steps.fastembed-version.outputs.version }}-minilm-l6-v2+bge-reranker-base-v1
      - name: Seed model cache on miss (sequential, controlled download)
        if: steps.model-cache.outputs.cache-hit != 'true'
        # Downloads exactly the two models the invariant tests below
        # need to find cached, one at a time. Serial on purpose: concurrent
        # first-use downloads into a shared cache dir race on the same blob
        # files (see the identical rationale in `test-rust-models` above).
        run: |
          cargo test -p pensyve-core --release embedding::tests::test_real_embedding_dimensions -- --ignored --test-threads=1
          cargo test -p pensyve-core --release reranker::tests::test_reranker_real_bge -- --ignored --test-threads=1
      - name: Pre-build no-network invariant tests with network available
        # Populate Cargo's target directory before entering the isolated
        # namespace so the test phase only executes already-built artifacts.
        run: cargo test -p pensyve-core --test test_no_network_invariants --no-run
      - name: Run no-network invariant tests with egress denied
        # GitHub-hosted Ubuntu runners provide passwordless sudo. A root-created
        # network namespace leaves the test process with no external interfaces;
        # the proxy variables are a second fail-fast guard for proxy-aware clients.
        env:
          # actionlint rejects case-duplicate keys, so only the uppercase pair is
          # declared here; the lowercase aliases most curl-family clients read are
          # set on the inner `env` invocation below.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
        run: |
          sudo unshare --net -- sudo -u "$USER" -E env \
            HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            FASTEMBED_CACHE_DIR="$FASTEMBED_CACHE_DIR" \
            PATH="$PATH" \
            HTTP_PROXY="$HTTP_PROXY" \
            HTTPS_PROXY="$HTTPS_PROXY" \
            http_proxy="$HTTP_PROXY" \
            https_proxy="$HTTPS_PROXY" \
            cargo test -p pensyve-core --test test_no_network_invariants

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          uv sync --extra dev
          uv run maturin develop --manifest-path pensyve-python/Cargo.toml
          uv run pytest tests/python/ -v

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install and test
        working-directory: pensyve-ts
        run: |
          bun install
          bun run build
          bun test

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: pensyve-go/go.mod
      - name: Run tests
        working-directory: pensyve-go
        run: go test ./... -v

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run tests
        working-directory: pensyve-wasm
        run: wasm-pack test --node

  test-gateway:
    name: Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gateway
        run: cargo build -p pensyve-mcp-gateway
      - name: Run gateway tests
        run: cargo test -p pensyve-mcp-gateway -p pensyve-mcp-tools
