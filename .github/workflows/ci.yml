name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python lint
        run: |
          uv sync --extra dev
          uv run ruff check pensyve_server/ integrations/ tests/
          uv run pyright pensyve_server/
      - uses: oven-sh/setup-bun@v2
      - name: TypeScript lint
        working-directory: pensyve-ts
        run: |
          bun install
          bun run lint

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace

  test-rust-postgres:
    name: Rust Tests (postgres)
    runs-on: ubuntu-latest
    # `pensyve-core`'s `postgres` feature is non-default. "Rust Tests" above
    # compiles it (pensyve-mcp-gateway turns it on), but nothing has ever run
    # it against a real server, so every Postgres-only behaviour — RLS
    # policies, the namespace GUC, the handwritten SQL in
    # `storage/postgres.rs` — was untested. That gap is what let the #218
    # scoped-delete bug through: SQLite has no row-level security, so no
    # existing test could observe it. Tracked by #225.
    #
    # Not a required check yet: promotion happens in repo settings once this
    # job has a few green runs behind it.
    services:
      postgres:
        # pgvector, not plain `postgres:16` — `postgres_schema.sql` opens with
        # `CREATE EXTENSION IF NOT EXISTS vector` and the stock image has no
        # such extension available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Deliberately not `DATABASE_URL`: the live tests create and drop their
      # own databases and roles, so they demand a test-only variable rather
      # than the one a real deployment reads. Tests skip themselves with an
      # explicit message when it is unset.
      #
      # This points at the *admin* role. Each test provisions a throwaway
      # database plus an unprivileged owner role from it and applies
      # `postgres_schema.sql` there (via `PostgresBackend::from_pool`), so the
      # schema needs no separate CI step and the `postgres` database stays
      # empty.
      PENSYVE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pensyve-core tests with the postgres feature
        run: cargo test -p pensyve-core --features postgres

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          uv sync --extra dev
          uv run maturin develop --manifest-path pensyve-python/Cargo.toml
          uv run pytest tests/python/ -v

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install and test
        working-directory: pensyve-ts
        run: |
          bun install
          bun run build
          bun test

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: pensyve-go/go.mod
      - name: Run tests
        working-directory: pensyve-go
        run: go test ./... -v

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run tests
        working-directory: pensyve-wasm
        run: wasm-pack test --node

  test-gateway:
    name: Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gateway
        run: cargo build -p pensyve-mcp-gateway
      - name: Run gateway tests
        run: cargo test -p pensyve-mcp-gateway -p pensyve-mcp-tools

  test-gateway-artifact-source:
    name: Gateway Artifact Source Contracts
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify shell syntax and immutable artifact flow fixtures
        run: |
          python3 - <<'PY'
          import platform
          assert platform.python_version().startswith("3.12.")
          assert platform.python_implementation() == "CPython"
          assert platform.machine() in {"x86_64", "aarch64", "arm64"}
          PY
          python3 -m venv "$RUNNER_TEMP/gateway-workflow-validator"
          printf '%s\n' \
            'PyYAML==6.0.2 --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476' \
            > "$RUNNER_TEMP/gateway-workflow-validator.requirements.txt"
          "$RUNNER_TEMP/gateway-workflow-validator/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/gateway-workflow-validator.requirements.txt"
          export PATH="$RUNNER_TEMP/gateway-workflow-validator/bin:$PATH"
          bash -n pensyve-mcp-gateway/scripts/fetch-model-bundle.sh
          bash -n pensyve-mcp-gateway/scripts/test-model-bundle.sh
          bash -n pensyve-mcp-gateway/scripts/gateway-image-artifact.sh
          bash -n pensyve-mcp-gateway/scripts/test-gateway-release-image.sh
          bash -n pensyve-mcp-gateway/scripts/promote-gateway-image.sh
          bash -n pensyve-mcp-gateway/scripts/test-gateway-artifact-flow.sh
          pensyve-mcp-gateway/scripts/test-gateway-artifact-flow.sh all
