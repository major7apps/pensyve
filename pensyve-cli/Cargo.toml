[package]
name = "pensyve-cli"
version = "4.0.0"
edition = "2024"
description = "Pensyve command-line interface — universal memory runtime for AI agents"
rust-version = "1.88"
license = "Apache-2.0"
homepage = "https://pensyve.com"
repository = "https://github.com/major7apps/pensyve"
documentation = "https://pensyve.com/docs"

[[bin]]
name = "pensyve"
path = "src/main.rs"

[dependencies]
pensyve-core = { path = "../pensyve-core", version = "4.0.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[lints]
workspace = true
