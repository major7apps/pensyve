[package]
name = "pensyve-cli"
version = "5.0.0"
edition = "2024"
description = "Pensyve command-line interface — universal memory runtime for AI agents"
rust-version = "1.94"
license = "Apache-2.0"
homepage = "https://github.com/major7apps/pensyve"
repository = "https://github.com/major7apps/pensyve"
documentation = "https://github.com/major7apps/pensyve/tree/main/docs"

[[bin]]
name = "pensyve"
path = "src/main.rs"

[dependencies]
pensyve-core = { path = "../pensyve-core", version = "5.0.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"

[lints]
workspace = true
