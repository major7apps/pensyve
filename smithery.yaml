# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery-yaml
# Pensyve: Universal memory runtime for AI agents
#
# Local MCP server over stdio: cargo install pensyve-mcp (offline, Apache-2.0)
# Self-hosting over HTTP: https://github.com/major7apps/pensyve/blob/main/docs/self-host.md

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({ command: "pensyve-mcp", args: ["--stdio"] })
